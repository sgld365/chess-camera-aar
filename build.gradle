plugins {
    id 'com.android.library' version '8.1.4'
}

android {
    namespace 'com.militarychess.camera'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.alibaba:fastjson:1.2.83'
}

// 构建后从 AAR 中删除 DCloud 桩类，避免与 uni-app SDK 冲突
afterEvaluate {
    android.libraryVariants.all { variant ->
        def aarTask = tasks.findByName("bundle${variant.name.capitalize()}Aar")
        if (aarTask) {
            aarTask.doLast {
                def aar = aarTask.archiveFile.get().asFile
                def tmp = file("${buildDir}/tmp/aar-clean-${variant.name}")
                delete tmp
                copy {
                    from zipTree(aar)
                    into tmp
                    exclude '**/io/dcloud/**'
                }
                delete aar
                ant.zip(destfile: aar) {
                    fileset(dir: tmp)
                }
                delete tmp
                println "Cleaned DCloud stubs from AAR: ${aar.name}"
            }
        }
    }
}
